<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简小部件 · Minimal Widgets</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cell:250px; --gap:18px;
  --ink:#111318; --grey:#9aa0aa;
  --red:#e04239; --navy:#1f2733; --blue:#4a5cc4;
}
body{
  background:#e9e9eb;font-family:"Noto Sans SC",-apple-system,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);padding:44px;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;
}
.board{display:grid;grid-template-columns:repeat(4,var(--cell));grid-auto-rows:var(--cell);gap:var(--gap)}

/* ---- 基础 ---- */
.cell{position:relative;overflow:hidden}
.white{background:#fff;color:var(--ink)}
.red{background:var(--red);color:#fff}
.navy{background:var(--navy);color:#fff}
.blue{background:var(--blue);color:#fff}
.circle{border-radius:50%}
.r44{border-radius:44px}
.rp{border-radius:999px}
.ctr{display:flex;align-items:center;justify-content:center}
.c2{grid-column:span 2}
.pad{padding:24px}
.fill{width:100%;height:100%}

/* ---- 字体 ---- */
.serif{font-family:"Playfair Display","Noto Serif SC",Georgia,"Times New Roman",serif}
.t-huge{font-size:88px;line-height:.92;font-weight:700;letter-spacing:-.02em}
.t-giant{font-size:138px;line-height:.9;font-weight:700;letter-spacing:-.03em;margin-top:-6px}
.t-xl{font-size:50px;line-height:1;font-weight:700;letter-spacing:-.01em}
.t-lg{font-size:34px;line-height:1;font-weight:700}
.t-md{font-size:23px;line-height:1.14;font-weight:700}
.t-sm{font-size:15px;line-height:1.25}
.t-xs{font-size:12px;line-height:1.25}
.grey{color:var(--grey)}
.acc{color:var(--red)}
.dim{color:rgba(255,255,255,.72)}
.ls{letter-spacing:.14em}
.fwb{font-weight:700}

/* ---- 图标 ---- */
.ico{display:block;width:44px;height:44px;flex-shrink:0}
.ico-s{width:34px;height:34px;flex-shrink:0}
.ico-m{width:27px;height:27px;flex-shrink:0}

/* ---- 迷你时钟 ---- */
.mclock{position:relative;display:block;width:34px;height:34px;border-radius:50%;border:2px solid currentColor;opacity:.9}
.mclock i{position:absolute;left:50%;bottom:50%;background:currentColor;border-radius:2px;transform-origin:50% 100%}
.mclock i.h{width:2.6px;height:6px;margin-left:-1.3px;transform:rotate(52deg)}
.mclock i.m{width:2px;height:11px;margin-left:-1px;transform:rotate(-38deg)}

/* ---- 主时钟 ---- */
.face{position:relative;width:250px;height:250px}
.hand{position:absolute;left:50%;bottom:50%;background:var(--ink);transform-origin:50% 100%;border-radius:99px}
.hand.hour{width:9px;height:62px;margin-left:-4.5px;transform:rotate(305deg)}
.hand.min{width:6px;height:88px;margin-left:-3px;transform:rotate(58deg)}
.hand.sec{width:3px;height:74px;margin-left:-1.5px;background:var(--red);transform:rotate(196deg)}
.pin{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--ink);z-index:3}
.face .dot-red{position:absolute;left:50%;top:71%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--red)}

/* 全刻度表盘 */
.tickring{position:absolute;inset:0}
.tickring i{position:absolute;background:var(--ink);border-radius:2px}
.full-clock .hand.hour{transform:rotate(300deg)}
.full-clock .hand.min{transform:rotate(62deg)}
.full-clock .hand.sec{transform:rotate(28deg);height:82px;width:2.5px;margin-left:-1.25px}
.full-clock .pin{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--red)}
.full-clock .sec::after{content:"";position:absolute;left:50%;top:-7px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--red)}

/* ---- 点阵 ---- */
.spark{position:relative;width:150px;height:150px}
.spark i{position:absolute;border-radius:50%;background:#fff}
.dgrad{display:grid;gap:8px;width:122px;height:122px}
.dgrad i{display:block;border-radius:50%;background:var(--ink)}
.cal-dots{display:grid;grid-template-columns:repeat(7,8px);gap:9px}
.cal-dots i{display:block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}
.cal-dots i.on{background:var(--red)}

/* ---- 进度环 ---- */
.ring{position:relative;width:54px;height:54px;flex-shrink:0}
.ring svg{display:block;transform:rotate(-90deg)}

/* ---- 步数虚线 ---- */
.stepline{display:flex;align-items:center;gap:9px}
.dotted{flex:1;height:4px;opacity:.75;
  background-image:radial-gradient(circle,#fff 1.6px,transparent 1.7px);
  background-size:9px 4px;background-repeat:repeat-x}

/* ---- 底部状态栏 ---- */
.statusbar{display:flex;align-items:center;justify-content:space-between}
.statusbar svg{width:31px;height:31px;display:block}

/* ---- 自动布局小工具 ---- */
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.between{display:flex;justify-content:space-between}
</style>
</head>
<body>

<script>
// 全刻度表盘：60 分钟刻度 + 12 小时主刻度
document.querySelectorAll('[data-ticks]').forEach(el=>{
  const ring = el.querySelector('.tickring');
  const S = 250, cx = S/2, top = 12.5;             // 刻度外圈半径 = cx - top
  for(let i=0;i<60;i++){
    const major = i % 5 === 0;
    const len = major ? 15 : 7.5, w = major ? 3.6 : 1.8;
    const d = document.createElement('i');
    d.style.cssText =
      `left:calc(50% - ${w/2}px);top:${top}px;width:${w}px;height:${len}px;`+
      `transform-origin:50% ${(cx-top).toFixed(1)}px;transform:rotate(${i*6}deg)`;
    ring.appendChild(d);
  }
});
// 螺旋点阵（蓝色下班卡 / 白色点阵卡）
document.querySelectorAll('[data-spark]').forEach(el=>{
  const [rings, step, size] = el.dataset.spark.split(',').map(Number);
  const col = el.dataset.color || '#fff';
  if(el.dataset.center !== '0'){            // 中心点，避免空心
    const c = document.createElement('i');
    c.style.cssText = `left:calc(50% - ${size/2}px);top:calc(50% - ${size/2}px);`
      + `width:${size}px;height:${size}px;background:${col}`;
    el.appendChild(c);
  }
  for(let k=1;k<=rings;k++){
    const n = 6*k, r = step*k, s = size*(1-(k-1)/(rings+2));
    for(let j=0;j<n;j++){
      const a = (j/n)*Math.PI*2 - Math.PI/2;
      const d = document.createElement('i');
      d.style.cssText = `left:calc(50% + ${(Math.cos(a)*r).toFixed(2)}px);top:calc(50% + ${(Math.sin(a)*r).toFixed(2)}px);`
        + `width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;margin:${(-s/2).toFixed(1)}px 0 0 ${(-s/2).toFixed(1)}px;`
        + `background:${col};opacity:${(1-(k-1)/(rings+1)*0.75).toFixed(2)}`;
      el.appendChild(d);
    }
  }
});
// 单圈点阵（count,radius,size,color[,startAngle])
document.querySelectorAll('[data-ring]').forEach(el=>{
  const [n, r, size, col, deg] = el.dataset.ring.split(',');
  for(let i=0;i<+n;i++){
    const a = (i/+n)*Math.PI*2 - Math.PI/2 + (+deg||0)*Math.PI/180;
    const d = document.createElement('i');
    d.style.cssText = `left:calc(50% + ${(Math.cos(a)*+r).toFixed(2)}px);top:calc(50% + ${(Math.sin(a)*+r).toFixed(2)}px);`
      + `width:${size}px;height:${size}px;margin:${-size/2}px 0 0 ${-size/2}px;background:${col}`;
    el.appendChild(d);
  }
});
// 渐变点阵（白色圆卡）：左上最实，右下最淡
document.querySelectorAll('[data-dgrad]').forEach(el=>{
  const [cols, rows] = el.dataset.dgrad.split(',').map(Number);
  el.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  el.style.gridTemplateRows = `repeat(${rows},1fr)`;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const d = document.createElement('i');
    d.style.opacity = (1 - 0.88*((r+c)/(rows+cols-2))).toFixed(2);
    el.appendChild(d);
  }
});
// 电量卡点阵日历
document.querySelectorAll('[data-cal]').forEach(el=>{
  const [rows, cols, on] = el.dataset.cal.split(',').map(Number);
  for(let i=0;i<rows*cols;i++){
    const d = document.createElement('i');
    if(i===on) d.className = 'on';
    el.appendChild(d);
  }
});
</script>
</body>
</html>
