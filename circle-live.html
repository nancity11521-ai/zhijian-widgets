<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆盘小部件 · 可交互</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#2c2c2c; --face:#0c0c0c; --tile:#232323;
  --wl:#f5f5f5;
  --ac:#ec3b2e; --acSoft:rgba(236,59,46,.85); --acPale:rgba(236,59,46,.55); --acGlow:rgba(236,59,46,.5);
}
body{
  background:var(--bg);color:var(--wl);padding:40px 40px 100px;
  font-family:"Rajdhani","Noto Sans SC",-apple-system,Arial,sans-serif;
  display:flex;justify-content:center;-webkit-font-smoothing:antialiased;user-select:none;
}
.board{display:grid;grid-template-columns:repeat(4,250px);grid-auto-rows:250px;gap:20px}

/* ═══════════ 圆盘基座 ═══════════ */
.w{
  position:relative;width:250px;height:250px;border-radius:50%;background:var(--face);
  display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--wl);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.065), 0 14px 30px rgba(0,0,0,.45);
}
/* 悬停抬起；点击用伪元素闪边，不动 transform，避免和 hover 抢 */
.w.tap{cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s ease}
.w.tap:hover{transform:translateY(-5px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16), 0 22px 44px rgba(0,0,0,.58)}
.w.tap:active{transform:translateY(-2px) scale(.975)}
.w::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 0 0 rgba(255,255,255,0);transition:box-shadow .3s ease}
.w.flash::after{box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}

.abs{position:absolute}
.fill{position:absolute;inset:0}
.lab{font-family:"Chakra Petch",sans-serif;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#9d9d9d;font-size:11px}
.cn{font-family:"Noto Sans SC",sans-serif;font-weight:400}
.dm{display:block;line-height:0}
.dm svg{display:block}
.hide{display:none !important}

/* ═══════════ 刻度圈 / 点圈 / 数字 ═══════════ */
.bezel,.dotring{position:absolute;inset:0}
.bezel i{position:absolute;border-radius:1px;display:block}
.dotring i{position:absolute;border-radius:50%;display:block}
.num{position:absolute;font-family:"Rajdhani",sans-serif;font-weight:600;line-height:1;transform:translate(-50%,-50%)}

/* ═══════════ 指针 ═══════════ */
.hands{position:absolute;inset:0}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:99px;will-change:transform}
.hand.h{width:7px;height:56px;margin-left:-3.5px;background:linear-gradient(0deg,#6b6b6b,#d2d2d2)}
.hand.m{width:6px;height:78px;margin-left:-3px;background:linear-gradient(0deg,#8d8d8d,#ffffff)}
.hand.s{width:2px;height:90px;margin-left:-1px;background:var(--ac);transition:background .3s}
.hub{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
  background:#0c0c0c;box-shadow:0 0 0 1.5px rgba(255,255,255,.6);z-index:3}
.hands.glow .hub{background:var(--ac);box-shadow:0 0 9px 2.5px var(--acGlow)}
.dialline{position:absolute;left:50%;top:50%;width:186px;height:186px;margin:-93px 0 0 -93px;
  border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.055)}

/* ═══════════ 浮动方块 / 胶片 ═══════════ */
.tile{background:var(--tile);border-radius:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 7px 16px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.045)}
.tile.lite{background:#e9e9e9;box-shadow:0 5px 12px rgba(0,0,0,.5)}
.tile.pure{background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.6)}
.sprockets{display:flex;justify-content:space-between;padding:0 12px}
.sprockets i{display:block;width:13px;height:6px;border-radius:1.5px;background:#fff}

/* ═══════════ AM / PM ═══════════ */
.ampm{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;
  padding:1px 8px;border-radius:7px;color:var(--acPale);transition:.3s}
.ampm.on{background:var(--ac);color:#fff;box-shadow:0 0 12px var(--acGlow)}

/* ═══════════ 底部控制条 ═══════════ */
.ctl{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:rgba(22,22,22,.94);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:7px 13px;
  box-shadow:0 12px 32px rgba(0,0,0,.55);z-index:90}
.grp{display:flex;align-items:center;gap:2px}
.cb{font-family:"Noto Sans SC",sans-serif;font-size:12px;line-height:1;color:#9a9a9a;background:transparent;
  border:0;padding:6px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.cb:hover{color:#f0f0f0;background:rgba(255,255,255,.08)}
.cb.on{background:#f0f0f0;color:#151515;font-weight:500}
.ctl .div{width:1px;height:16px;background:rgba(255,255,255,.13)}
.cb.dot{width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cb.dot i{width:12px;height:12px;border-radius:50%;background:var(--c);display:block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.cb.dot.on{background:#f0f0f0}

/* ═══════════ 提示 ═══════════ */
.hint{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:rgba(240,240,240,.96);color:#151515;
  font-family:"Noto Sans SC",sans-serif;font-size:12.5px;letter-spacing:.02em;padding:9px 18px;border-radius:999px;
  opacity:0;transition:opacity .4s ease;pointer-events:none;z-index:95;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.45)}
.hint.on{opacity:1}
</style>
</head>
<body>
<div class="board">

<!-- ═══ R1·1 电量：分段刻度圈 ═══ -->
<div class="w tap" data-tap="battery" title="切换电量">
  <div class="bezel" id="bezBat" data-bezel='{"n":30,"r0":106,"r1":124,"w":5,"c":"#dcdcdc","a0":218,"a1":502,"fade":2.5,"seg":30}'></div>
  <div style="display:flex;flex-direction:column;align-items:center">
    <svg width="31" height="37" viewBox="0 0 24 27" fill="none" stroke="currentColor" stroke-width="1.35" style="color:#d4d4d4">
      <rect x="6.6" y="5" width="10.8" height="19" rx="3"/>
      <rect x="10" y="1.8" width="4" height="3" rx="1.2" fill="currentColor" stroke="none"/>
    </svg>
    <div class="lab" style="font-size:10px;margin-top:7px">Battery</div>
    <span class="dm" data-dm="batpct" data-h="32" data-c="#f5f5f5" style="margin-top:7px"></span>
  </div>
</div>

<!-- ═══ R1·2 指针钟（数字 1-12） ═══ -->
<div class="w tap" data-tap="sec" title="秒针 显示 / 隐藏">
  <div class="dialline"></div>
  <div class="bezel" data-bezel='{"n":60,"r0":115,"r1":125,"w":1.5,"c":"#c8c8c8","major":5,"mr0":109,"mw":2.6,"mc":"#ffffff"}'></div>
  <div class="fill" data-nums='{"r":90,"s":15,"c":"#a9a9a9"}'></div>
  <div class="hands" data-hands='{"h":56,"m":78}'></div>
  <div class="abs" data-opt="clk" style="left:0;right:0;bottom:58px;display:flex;justify-content:center">
    <span class="dm" data-dm="md" data-h="12" data-c="#6f6f6f"></span>
  </div>
</div>

<!-- ═══ R1·3 点阵时间 + 日期 ═══ -->
<div class="w tap" data-tap="fmt" title="12 / 24 小时制">
  <div style="display:flex;flex-direction:column;align-items:center">
    <span class="dm" data-dm="hm" data-h="46" data-c="#f8f8f8"></span>
    <div style="display:flex;align-items:center;gap:11px;margin-top:18px">
      <span class="dm" data-dm="md" data-h="12" data-c="#8c8c8c"></span>
      <span class="cn" style="font-size:12px;color:#8c8c8c" data-live="dowcn">星期六</span>
    </div>
  </div>
</div>

<!-- ═══ R1·4 堆叠 时 / 日期 / 分 ═══ -->
<div class="w tap" data-tap="day" title="切换日期">
  <div class="fill">
    <span class="abs dm" data-dm="hh" data-h="50" data-c="#f8f8f8" style="left:44px;top:44px"></span>
    <div class="abs" style="left:92px;top:104px;display:flex;align-items:center;gap:9px">
      <span class="dm" data-dm="md" data-h="10" data-c="#7d7d7d"></span>
      <span class="cn" style="font-size:11px;color:#7d7d7d" data-live="dowcn">星期六</span>
    </div>
    <span class="abs dm" data-dm="mm" data-h="50" data-c="#f8f8f8" style="left:118px;top:130px"></span>
  </div>
</div>

<!-- ═══ R2·5 指针钟 TIME（红针 + 光点） ═══ -->
<div class="w tap" data-tap="sec" title="秒针 显示 / 隐藏">
  <div class="bezel" data-bezel='{"n":60,"r0":104,"r1":124,"w":1.9,"c":"#e2e2e2","major":5,"mr0":95,"mw":3.6,"mc":"#ffffff"}'></div>
  <div class="hands glow" data-hands='{"h":60,"m":82}'></div>
  <div class="abs lab" style="right:46px;bottom:56px;font-size:12px">Time</div>
</div>

<!-- ═══ R2·6 胶片日历 ═══ -->
<div class="w tap" data-tap="day" title="切换日期">
  <div class="abs lab" style="top:36px;left:0;right:0;text-align:center;font-size:12px;color:#d2d2d2">Mar.</div>
  <div class="abs" style="left:14px;right:14px;top:74px;background:#1b1b1b;padding:7px 0;box-shadow:0 8px 18px rgba(0,0,0,.5)">
    <div class="sprockets" data-sprockets="12"></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:9px;padding:8px 0">
      <div class="tile lite" style="width:50px;height:50px;border-radius:13px"><span class="dm" data-dm="d-1" data-h="23" data-c="#6a6a6a"></span></div>
      <div class="tile pure" style="width:64px;height:64px;border-radius:17px"><span class="dm" data-dm="d0" data-h="30" data-c="#111111"></span></div>
      <div class="tile lite" style="width:50px;height:50px;border-radius:13px"><span class="dm" data-dm="d+1" data-h="23" data-c="#6a6a6a"></span></div>
    </div>
    <div class="sprockets" data-sprockets="12"></div>
  </div>
  <div class="abs cn" style="bottom:42px;left:0;right:0;text-align:center;font-size:12px;color:#ededed" data-live="dowcn">星期六</div>
</div>

<!-- ═══ R2·7 生日进度环 ═══ -->
<div class="w tap" data-tap="bday" title="已过天数 / 距年末">
  <svg class="abs" width="250" height="250" viewBox="0 0 250 250" fill="none">
    <circle cx="125" cy="125" r="104" stroke="#232323" stroke-width="7"/>
    <path data-arc="bday" d="" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </svg>
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="lab" style="font-size:11px">Birthday</div>
    <span class="dm" data-dm="bday" data-h="52" data-c="#f8f8f8" style="margin-top:5px"></span>
    <div class="cn" style="font-size:10px;color:#8a8a8a;margin-top:9px" data-live="bdaycap">已过天数</div>
    <span class="dm" data-dm="bdate" data-h="10" data-c="#8a8a8a" style="margin-top:4px"></span>
  </div>
</div>

<!-- ═══ R2·8 白圈 + 双方块 + AM/PM ═══ -->
<div class="w tap" data-tap="ampm" title="切换 AM / PM">
  <svg class="abs" width="250" height="250" viewBox="0 0 250 250" fill="none">
    <circle cx="125" cy="125" r="112" stroke="#ededed" stroke-width="1.6"/>
  </svg>
  <div class="bezel" data-bezel='{"n":60,"r0":105,"r1":110,"w":1.1,"c":"#b4b4b4","major":5,"mr0":101,"mw":2,"mc":"#ffffff"}'></div>
  <div class="fill" data-nums='{"r":87,"s":14,"c":"#9e9e9e"}'></div>
  <div class="tile abs" style="width:78px;height:78px;left:126px;top:42px">
    <span class="dm" data-dm="hh" data-h="38" data-c="#f0f0f0"></span>
  </div>
  <div class="tile abs" style="width:78px;height:78px;left:46px;top:130px">
    <span class="dm" data-dm="mm" data-h="38" data-c="#f0f0f0"></span>
  </div>
  <div class="abs" style="left:62px;top:90px"><span class="ampm on" id="ampmAM">AM</span></div>
  <div class="abs" style="left:154px;top:176px"><span class="ampm" id="ampmPM">PM</span></div>
</div>

<!-- ═══ R3·9 三日横带 ═══ -->
<div class="w tap" data-tap="day" title="切换日期">
  <div class="abs" style="left:-14px;right:-14px;top:78px;height:96px;background:#2b2b2b;
       display:flex;align-items:center;justify-content:center;gap:22px">
    <span class="dm" data-dm="d-1" data-h="24" data-c="#7b7b7b"></span>
    <span class="dm" data-dm="d0" data-h="48" data-c="#ffffff"></span>
    <span class="dm" data-dm="d+1" data-h="24" data-c="#7b7b7b"></span>
  </div>
  <div class="abs lab" style="top:38px;left:0;right:0;text-align:center;font-size:13px;color:#cdcdcd">March</div>
  <div class="abs cn" style="bottom:40px;left:0;right:0;text-align:center;font-size:13px;color:#ededed" data-live="dowcn">星期六</div>
</div>

<!-- ═══ R3·10 花瓣情景模式 ═══ -->
<div class="w tap" data-tap="flower" title="情景模式开关" id="flowerW" style="background:#0a0a0a">
  <svg class="abs" width="250" height="250" viewBox="0 0 250 250" id="flowerSvg"></svg>
  <div class="abs" style="left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
       background:#242424;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" id="flowerIco">
      <path d="M12 3.4v7.4"/><path d="M7.1 6.3a6.3 6.3 0 1 0 9.8 0"/>
    </svg>
  </div>
</div>

<!-- ═══ R3·11 全信息卡 ═══ -->
<div class="w tap" data-tap="fmt" title="12 / 24 小时制">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="cn" style="font-size:13px;color:#d4d4d4" data-live="dowcn">星期六</div>
    <span class="dm" data-dm="full" data-h="11" data-c="#8a8a8a" style="margin-top:7px"></span>
    <span class="dm" data-dm="hm" data-h="39" data-c="#f8f8f8" style="margin-top:11px"></span>
    <div style="font-size:11px;color:#7c7c7c;line-height:1.5;margin-top:13px;text-align:left;width:100%">
      Time is free,<br>but it's priceless.
    </div>
  </div>
</div>

<!-- ═══ R3·12 今日剩余 ═══ -->
<div class="w tap" data-tap="remain" title="剩余 / 已过">
  <svg class="abs" width="250" height="250" viewBox="0 0 250 250" fill="none">
    <circle cx="125" cy="125" r="107" stroke="#262626" stroke-width="5"/>
    <path data-arc="remain" d="" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </svg>
  <div style="display:flex;flex-direction:column;align-items:center">
    <div style="display:flex;align-items:center;gap:9px">
      <span class="lab" style="font-size:11px;color:#c6c6c6" data-live="monen">March</span>
      <span class="cn" style="font-size:11px;color:#8a8a8a" data-live="dowcn">星期六</span>
    </div>
    <span class="dm" data-dm="full" data-h="10" data-c="#7d7d7d" style="margin-top:5px"></span>
    <span class="dm" data-dm="hm" data-h="34" data-c="#f8f8f8" style="margin-top:9px"></span>
    <div class="cn" style="font-size:10px;color:#8a8a8a;margin-top:11px" data-live="remcap">今日剩余</div>
    <div style="display:flex;align-items:flex-end;gap:5px;margin-top:2px">
      <span class="dm" data-dm="remainh" data-h="18" data-c="#dcdcdc"></span>
      <span class="cn" style="font-size:11px;color:#9a9a9a">小时</span>
    </div>
  </div>
</div>

<!-- ═══ R4·13 指针钟 + 点阵时间 ═══ -->
<div class="w tap" data-tap="clkdm" title="点阵时间 显示 / 隐藏">
  <div class="bezel" data-bezel='{"n":60,"r0":110,"r1":124,"w":1.7,"c":"#dcdcdc","major":5,"mr0":103,"mw":3.2,"mc":"#ffffff"}'></div>
  <div class="hands" data-hands='{"h":54,"m":76}'></div>
  <div class="abs" data-opt="clk" style="right:44px;bottom:54px">
    <span class="dm" data-dm="hm" data-h="16" data-c="#ffffff"></span>
  </div>
</div>

<!-- ═══ R4·14 超大点阵时间 ═══ -->
<div class="w tap" data-tap="fmt" title="12 / 24 小时制">
  <div style="display:flex;flex-direction:column;align-items:center">
    <span class="dm" data-dm="hm" data-h="52" data-c="#fbfbfb"></span>
    <div style="display:flex;align-items:center;gap:10px;margin-top:16px">
      <span class="dm" data-dm="md" data-h="11" data-c="#808080"></span>
      <span class="cn" style="font-size:11px;color:#808080" data-live="dowcn">星期六</span>
    </div>
  </div>
</div>

<!-- ═══ R4·15 日期焦点卡 ═══ -->
<div class="w tap" data-tap="day" title="切换日期">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="lab" style="font-size:13px;color:#c9c9c9" data-live="monen">March</div>
    <span class="dm" data-dm="d0" data-h="76" data-c="#fbfbfb" style="margin-top:3px"></span>
    <div class="cn" style="font-size:13px;color:#d4d4d4;margin-top:5px" data-live="dowcn">星期六</div>
    <span class="dm" data-dm="year" data-h="10" data-c="#7d7d7d" style="margin-top:11px"></span>
  </div>
</div>

<!-- ═══ R4·16 点圈指针钟 ═══ -->
<div class="w tap" data-tap="sec" title="秒针 显示 / 隐藏">
  <div class="dotring" data-dotring='{"n":60,"r":115,"d":3.6,"c":"#949494","major":5,"md":5,"mc":"#ffffff"}'></div>
  <div class="hands" data-hands='{"h":52,"m":74}'></div>
  <div class="abs" data-opt="clk" style="left:0;right:0;bottom:50px;display:flex;justify-content:center">
    <span class="dm" data-dm="md" data-h="12" data-c="#6f6f6f"></span>
  </div>
</div>


<!-- ═══ R5·17 黑盘点阵指针钟 ═══ -->

<script>
const $$ = s => [...document.querySelectorAll(s)];
const pad2 = n => String(n).padStart(2, '0');
const setText = (k, v) => $$(`[data-live="${k}"]`).forEach(e => { v = String(v); if (e.textContent !== v) e.textContent = v; });

/* ═══════════ 5×7 点阵字库 ═══════════ */
const DM = {
  '0':'11111 10001 10001 10001 10001 10001 11111',
  '1':'00100 01100 00100 00100 00100 00100 11111',
  '2':'11111 00001 00001 11111 10000 10000 11111',
  '3':'11111 00001 00001 11111 00001 00001 11111',
  '4':'10001 10001 10001 11111 00001 00001 00001',
  '5':'11111 10000 10000 11111 00001 00001 11111',
  '6':'11111 10000 10000 11111 10001 10001 11111',
  '7':'11111 00001 00001 00010 00100 01000 01000',
  '8':'11111 10001 10001 11111 10001 10001 11111',
  '9':'11111 10001 10001 11111 00001 00001 11111',
  ':':'00000 00100 00000 00000 00000 00100 00000',
  '/':'00001 00010 00010 00100 01000 01000 10000',
  '.':'00000 00000 00000 00000 00000 00000 00100',
  '-':'00000 00000 00000 01110 00000 00000 00000',
  '%':'11000 11001 00010 00100 01000 10011 00011',
  ' ':'00000 00000 00000 00000 00000 00000 00000'
};
const ADV = { ':':2.6, '.':2.6, '/':5.4, ' ':3.4 };      // 单位 = 点距

function dm(text, h, color){
  const gap = .34, u = 1 + gap, defAdv = 6.4;            // 纯单位数；消费处统一乘 u
  let x = 0, rects = '';
  for (const ch of String(text)){
    const bm = DM[ch];
    if (bm) bm.split(' ').forEach((row, r) => {
      for (let c = 0; c < 5; c++) if (row[c] === '1')
        rects += `<rect x="${(x + c * u).toFixed(2)}" y="${(r * u).toFixed(2)}" width="1" height="1" rx="0.3"/>`;
    });
    x += (ADV[ch] || defAdv) * u;
  }
  const W = Math.max(x - 1.4 * u, 1), H = 7 * u, sc = h / H;
  return `<svg width="${(W * sc).toFixed(1)}" height="${h}" viewBox="0 0 ${W.toFixed(2)} ${H.toFixed(2)}" fill="${color}">${rects}</svg>`;
}
function renderDM(key, val){
  const v = String(val);
  $$(`[data-dm="${key}"]`).forEach(el => {
    if (el.dataset.v === v) return;
    el.dataset.v = v;
    el.innerHTML = dm(v, +el.dataset.h, el.dataset.c || '#f5f5f5');
  });
}

/* ═══════════ 几何生成 ═══════════ */
const CX = 125, CY = 125;
function bezel(el, o){
  const { n = 60, r0 = 110, r1 = 124, w = 1.6, c = '#d0d0d0', major = 5, mr0 = 104, mw = 3,
          mc = '#ffffff', a0 = 0, a1 = 360, fade = 0, seg = null } = o;
  const span = a1 - a0, inc = span < 359.9, step = span / (inc ? n - 1 : n);
  for (let i = 0; i < n; i++){
    const mj = major && i % major === 0, ang = a0 + step * i, y0 = mj ? mr0 : r0, ww = mj ? mw : w;
    let op = 1;
    if (fade) op *= Math.min(1, Math.min(i, n - 1 - i) / fade);
    if (seg !== null && i >= seg) op *= .12;
    const d = document.createElement('i');
    d.style.cssText = `left:${CX - ww / 2}px;top:${CY - r1}px;width:${ww}px;height:${r1 - y0}px;`
      + `transform-origin:50% ${r1}px;transform:rotate(${ang}deg);background:${mj ? mc : c};opacity:${op.toFixed(3)}`;
    el.appendChild(d);
  }
}
function dotring(el, o){
  const { n = 60, r = 115, d = 3.2, c = '#8e8e8e', major = 5, md = 4.6, mc = '#ffffff' } = o;
  for (let i = 0; i < n; i++){
    const mj = major && i % major === 0, s = mj ? md : d, a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const e = document.createElement('i');
    e.style.cssText = `left:${CX + Math.cos(a) * r - s / 2}px;top:${CY + Math.sin(a) * r - s / 2}px;`
      + `width:${s}px;height:${s}px;background:${mj ? mc : c};opacity:${mj ? 1 : .72}`;
    el.appendChild(e);
  }
}
function nums(el, o){
  const { r = 88, s = 15, c = '#a9a9a9' } = o;
  for (let i = 1; i <= 12; i++){
    const a = (i * 30 - 90) * Math.PI / 180, e = document.createElement('span');
    e.className = 'num'; e.textContent = i;
    e.style.cssText = `left:${CX + Math.cos(a) * r}px;top:${CY + Math.sin(a) * r}px;font-size:${s}px;color:${c}`;
    el.appendChild(e);
  }
}
function hands(el, o){
  const { h = 56, m = 78 } = o;
  el.innerHTML = `<div class="hand h" style="height:${h}px"></div>`
               + `<div class="hand m" style="height:${m}px"></div>`
               + `<div class="hand s"></div><div class="hub"></div>`;
}
const P = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };
function arcD(r, a0, a1){
  const [x0, y0] = P(r, a0), [x1, y1] = P(r, a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} ${a1 > a0 ? 1 : 0} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

$$('[data-bezel]').forEach(el => bezel(el, JSON.parse(el.dataset.bezel)));
$$('[data-dotring]').forEach(el => dotring(el, JSON.parse(el.dataset.dotring)));
$$('[data-nums]').forEach(el => nums(el, JSON.parse(el.dataset.nums)));
$$('[data-hands]').forEach(el => hands(el, JSON.parse(el.dataset.hands)));
$$('[data-sprockets]').forEach(el => {
  for (let i = 0; i < +el.dataset.sprockets; i++) el.appendChild(document.createElement('i'));
});
(function(){
  const g = document.getElementById('flowerSvg');
  for (let i = 0; i < 6; i++){                      // 花瓣：正坐标 + 绕圆心旋转
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', 108.5); r.setAttribute('y', 31);
    r.setAttribute('width', 33); r.setAttribute('height', 68); r.setAttribute('rx', 16.5);
    r.setAttribute('fill', '#3a3a3a'); r.setAttribute('stroke', '#131313'); r.setAttribute('stroke-width', '1');
    r.setAttribute('transform', `rotate(${i * 60} 125 125)`);
    g.appendChild(r);
  }
})();

/* ═══════════ 状态 ═══════════ */
const S = {
  batArr: [100, 85, 65, 45, 20], batIdx: 0,
  ampm: new Date().getHours() < 12 ? 'am' : 'pm',
  flower: true, bdayUsed: true, remainMode: true,
  dayShift: 0, fmt24: true,
  sweep: true, secOn: true, clkdm: true, accent: 'red', c1Sec: true, c2Orbit: true, c3SecMode: false
};
const ACCENTS = {
  red:   { c:'#ec3b2e', soft:'rgba(236,59,46,.85)', pale:'rgba(236,59,46,.55)', glow:'rgba(236,59,46,.5)' },
  white: { c:'#eaeaea', soft:'rgba(234,234,234,.8)', pale:'rgba(234,234,234,.42)', glow:'rgba(234,234,234,.38)' },
  blue:  { c:'#4a7fe0', soft:'rgba(74,127,224,.85)', pale:'rgba(74,127,224,.55)', glow:'rgba(74,127,224,.5)' }
};
const MON_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const BIRTH = { y: 2020, m: 2, d: 21 };

const now   = () => { const d = new Date(); d.setDate(d.getDate() + S.dayShift); return d; };
const dayAt = off => { const t = now(); t.setDate(t.getDate() + off); return t; };

/* ═══════════ 渲染 ═══════════ */
function renderBattery(){
  const p = S.batArr[S.batIdx];
  renderDM('batpct', p + '%');
  const el = document.getElementById('bezBat'), lit = Math.round(p / 100 * 30);
  [...el.children].forEach((c, i) => { c.style.opacity = i < lit ? '1' : '.13'; });
}
function renderFlower(){
  const on = S.flower;
  [...document.getElementById('flowerSvg').children]
    .forEach(r => r.setAttribute('fill', on ? '#3a3a3a' : '#1b1b1b'));
  document.getElementById('flowerIco').style.opacity = on ? '1' : '.28';
  document.getElementById('flowerW').style.background = on ? '#0a0a0a' : '#070707';
}
function renderAmpm(){
  const am = S.ampm === 'am';
  document.getElementById('ampmAM').classList.toggle('on', am);
  document.getElementById('ampmPM').classList.toggle('on', !am);
}
function renderOpts(){
  const a = ACCENTS[S.accent], r = document.documentElement.style;
  r.setProperty('--ac', a.c); r.setProperty('--acSoft', a.soft);
  r.setProperty('--acPale', a.pale); r.setProperty('--acGlow', a.glow);
  $$('[data-opt="clk"]').forEach(e => e.classList.toggle('hide', !S.clkdm));
  $$('.hand.s').forEach(e => e.classList.toggle('hide', !S.secOn));
}
function renderTexts(){
  const t = new Date(), d = now();
  const H12 = t.getHours() % 12 === 0 ? 12 : t.getHours() % 12;
  const hh = S.fmt24 ? pad2(t.getHours()) : String(H12);   // 12 小时制去前导零，切换才看得出来
  renderDM('hm',   hh + ':' + pad2(t.getMinutes()));
  renderDM('hh',   hh);
  renderDM('mm',   pad2(t.getMinutes()));
  renderDM('md',   `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`);
  renderDM('full', `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`);
  renderDM('d0',   d.getDate());
  renderDM('d-1',  dayAt(-1).getDate());
  renderDM('d+1',  dayAt(1).getDate());
  renderDM('year', d.getFullYear());
  setText('dowcn', DOW_CN[d.getDay()]);
  setText('monen', MON_EN[d.getMonth()]);
}
function renderBday(){
  const d = now(), y = d.getFullYear();
  const doy = Math.floor((d - new Date(y, 0, 1)) / 864e5) + 1;
  const total = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
  const val = S.bdayUsed ? doy : total - doy;
  renderDM('bday', val);
  renderDM('bdate', `${BIRTH.y}/${pad2(BIRTH.m + 1)}/${pad2(BIRTH.d)}`);
  setText('bdaycap', S.bdayUsed ? '已过天数' : '距年末');
  document.querySelector('[data-arc="bday"]').setAttribute('d', arcD(104, 0, 360 * (val / total)));
}
function renderRemain(){
  const d = new Date();
  const sec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  const frac = Math.min(1, (86400 - sec) / 86400), use = S.remainMode ? frac : 1 - frac;
  document.querySelector('[data-arc="remain"]').setAttribute('d', arcD(107, 0, -360 * use));
  setText('remcap', S.remainMode ? '今日剩余' : '今日已过');
  renderDM('remainh', Math.floor((S.remainMode ? 86400 - sec : sec) / 3600));
}

/* ═══════════ 走针：rAF 逐帧，支持扫秒 / 跳秒 ═══════════ */
const handH = $$('.hand.h'), handM = $$('.hand.m'), handS = $$('.hand.s');
let lastMin = -1;
function frame(){
  const d = new Date();
  const secF  = S.sweep ? d.getSeconds() + d.getMilliseconds() / 1000 : d.getSeconds();
  const minF  = d.getMinutes() + secF / 60;
  const hourF = (d.getHours() % 12) + minF / 60;
  const sT = `rotate(${(secF * 6).toFixed(2)}deg)`;
  const mT = `rotate(${(minF * 6).toFixed(2)}deg)`;
  const hT = `rotate(${(hourF * 30).toFixed(2)}deg)`;
  for (const e of handS) e.style.transform = sT;
  for (const e of handM) e.style.transform = mT;
  for (const e of handH) e.style.transform = hT;
  const m = d.getMinutes();
  if (m !== lastMin){ lastMin = m; renderTexts(); renderRemain(); renderBday(); }
  requestAnimationFrame(frame);
}
function refresh(){ lastMin = -1; renderTexts(); renderRemain(); renderBday(); }

/* ═══════════ 交互 ═══════════ */
const ACTIONS = {
  battery(){ S.batIdx = (S.batIdx + 1) % S.batArr.length; renderBattery(); return '电量 ' + S.batArr[S.batIdx] + '%'; },
  sec(){ S.secOn = !S.secOn; renderOpts(); return S.secOn ? '显示秒针' : '隐藏秒针'; },
  clkdm(){ S.clkdm = !S.clkdm; renderOpts(); return S.clkdm ? '显示点阵时间' : '隐藏点阵时间'; },
  fmt(){ S.fmt24 = !S.fmt24; renderTexts(); syncCtl(); return S.fmt24 ? '24 小时制' : '12 小时制'; },
  day(){ S.dayShift = (S.dayShift + 1) % 14; refresh(); return '日期 +1 天'; },
  ampm(){ S.ampm = S.ampm === 'am' ? 'pm' : 'am'; renderAmpm(); return S.ampm.toUpperCase(); },
  flower(){ S.flower = !S.flower; renderFlower(); return S.flower ? '情景模式 开' : '情景模式 关'; },
  bday(){ S.bdayUsed = !S.bdayUsed; renderBday(); return S.bdayUsed ? '已过天数' : '距年末'; },
  remain(){ S.remainMode = !S.remainMode; renderRemain(); return S.remainMode ? '今日剩余' : '今日已过'; }
};
$$('[data-tap]').forEach(el => el.addEventListener('click', () => {
  const msg = ACTIONS[el.dataset.tap]?.();
  flash(el); if (msg) toast(msg);
}));

/* ═══════════ 控制条 ═══════════ */
const ACCENT_CN = { red:'红', white:'白', blue:'蓝' };
$$('.ctl .cb').forEach(btn => btn.addEventListener('click', () => {
  const { set, v } = btn.dataset;
  if (set === 'sweep'){ S.sweep = v === '1'; toast(S.sweep ? '扫秒 · 连续走针' : '跳秒 · 每秒一跳'); }
  if (set === 'fmt'){ S.fmt24 = v === '24'; renderTexts(); toast(S.fmt24 ? '24 小时制' : '12 小时制'); }
  if (set === 'accent'){ S.accent = v; renderOpts(); toast('强调色 · ' + ACCENT_CN[v]); }
  syncCtl();
}));
function syncCtl(){
  $$('.ctl .cb').forEach(b => {
    const { set, v } = b.dataset;
    const on = set === 'sweep' ? String(S.sweep ? 1 : 0) === v
             : set === 'fmt'   ? (S.fmt24 ? '24' : '12') === v
             : S.accent === v;
    b.classList.toggle('on', on);
  });
}

/* ═══════════ 反馈 ═══════════ */
const hint = document.getElementById('hint');
let ht;
function toast(t){
  hint.textContent = t; hint.classList.add('on');
  clearTimeout(ht); ht = setTimeout(() => hint.classList.remove('on'), 1900);
}
function flash(el){
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 320);
}


function initClock3Ticks(){
  const g = document.getElementById('c3TicksGroup');
  if(!g) return;
  g.innerHTML = '';
  for(let i = 0; i < 36; i++){
    const deg = i * 10;
    const rad = (deg - 90) * Math.PI / 180;
    const x1 = (125 + 86 * Math.cos(rad)).toFixed(2);
    const y1 = (125 + 86 * Math.sin(rad)).toFixed(2);
    const x2 = (125 + 98 * Math.cos(rad)).toFixed(2);
    const y2 = (125 + 98 * Math.sin(rad)).toFixed(2);
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1);
    line.setAttribute("x2", x2); line.setAttribute("y2", y2);
    line.setAttribute("stroke", "#c8c8c8");
    line.setAttribute("stroke-width", "2.4");
    line.setAttribute("stroke-linecap", "round");
    line.dataset.deg = deg;
    g.appendChild(line);
  }
}

/* ═══════════ 启动 ═══════════ */
initClock3Ticks(); renderBattery(); renderFlower(); renderAmpm(); renderOpts(); syncCtl();
refresh();
requestAnimationFrame(frame);
setTimeout(() => toast('轻触圆盘可交互 · 底部可切换扫秒 / 12-24H / 强调色'), 500);
</script>
</body>
</html>
