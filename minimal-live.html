<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简小部件 · 交互版</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cell:250px; --gap:18px;
  --ink:#111318; --grey:#9aa0aa;
  --red:#e04239; --navy:#1f2733; --blue:#4a5cc4;
}
body{
  background:#e9e9eb;font-family:"Noto Sans SC",-apple-system,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);padding:44px;display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
}
.board{display:grid;grid-template-columns:repeat(4,var(--cell));grid-auto-rows:var(--cell);gap:var(--gap)}

/* ---- 基础 ---- */
.cell{position:relative;overflow:hidden}
.white{background:#fff;color:var(--ink)}
.red{background:var(--red);color:#fff}
.navy{background:var(--navy);color:#fff}
.blue{background:var(--blue);color:#fff}
.circle{border-radius:50%}
.r44{border-radius:44px}
.rp{border-radius:999px}
.ctr{display:flex;align-items:center;justify-content:center}
.c2{grid-column:span 2}
.pad{padding:24px}
.row{display:flex;align-items:center}
.between{display:flex;justify-content:space-between}

/* ---- 字体 ---- */
.serif{font-family:"Playfair Display","Noto Serif SC",Georgia,"Times New Roman",serif}
.t-giant{font-size:138px;line-height:.9;font-weight:700;letter-spacing:-.03em;margin-top:-6px}
.t-huge{font-size:88px;line-height:.92;font-weight:700;letter-spacing:-.02em}
.t-xl{font-size:50px;line-height:1;font-weight:700;letter-spacing:-.01em}
.t-lg{font-size:34px;line-height:1;font-weight:700}
.t-md{font-size:23px;line-height:1.14;font-weight:700}
.t-sm{font-size:15px;line-height:1.25}
.t-xs{font-size:12px;line-height:1.25}
.grey{color:var(--grey)}
.acc{color:var(--red)}
.dim{color:rgba(255,255,255,.72)}
.ls{letter-spacing:.14em}
.fwb{font-weight:700}

/* ---- 图标 ---- */
.ico{display:block;width:44px;height:44px;flex-shrink:0}
.ico-s{width:34px;height:34px;flex-shrink:0}
.ico-m{width:27px;height:27px;flex-shrink:0}

/* ---- 迷你时钟 ---- */
.mclock{position:relative;display:block;width:34px;height:34px;border-radius:50%;border:2px solid currentColor;opacity:.9}
.mclock i{position:absolute;left:50%;bottom:50%;background:currentColor;border-radius:2px;transform-origin:50% 100%}
.mclock i.h{width:2.6px;height:6px;margin-left:-1.3px;transform:rotate(52deg)}
.mclock i.m{width:2px;height:11px;margin-left:-1px;transform:rotate(-38deg)}

/* ---- 表盘 ---- */
.face{position:relative;width:250px;height:250px}
.hand{position:absolute;left:50%;bottom:50%;background:var(--ink);transform-origin:50% 100%;border-radius:99px}
.hand.hour{width:9px;height:62px;margin-left:-4.5px}
.hand.min{width:6px;height:88px;margin-left:-3px}
.hand.sec{width:3px;height:74px;margin-left:-1.5px;background:var(--red)}
.pin{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--ink);z-index:3}
.face .dot-red{position:absolute;left:50%;top:71%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--red)}
.full-clock .hand.hour{width:8px;height:58px;margin-left:-4px}
.full-clock .hand.min{width:5.5px;height:84px;margin-left:-2.75px}
.full-clock .hand.sec{height:82px;width:2.5px;margin-left:-1.25px}
.full-clock .pin{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--red)}
.full-clock .sec::after{content:"";position:absolute;left:50%;top:-7px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--red)}
.tickring{position:absolute;inset:0}
.tickring i{position:absolute;background:var(--ink);border-radius:2px}

/* ---- 点阵 ---- */
.spark{position:relative;width:150px;height:150px}
.spark i{position:absolute;border-radius:50%;background:#fff}
.dgrad{display:grid;gap:8px;width:122px;height:122px}
.dgrad i{display:block;border-radius:50%;background:var(--ink)}
.cal-dots{display:grid;grid-template-columns:repeat(7,8px);gap:9px}
.cal-dots i{display:block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}
.cal-dots i.on{background:var(--red)}
.ring{position:relative;width:54px;height:54px;flex-shrink:0}
.ring svg{display:block;transform:rotate(-90deg)}

/* ---- 步数 ---- */
.stepline{position:relative;height:34px}
.stepline .dotted{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;opacity:.7;
  background-image:radial-gradient(circle,#fff 1.6px,transparent 1.7px);
  background-size:9px 4px;background-repeat:repeat-x}
.stepline .walker{position:absolute;top:0;left:0;width:34px;height:34px;transition:left .6s cubic-bezier(.34,1.3,.64,1)}

/* ---- 状态栏 ---- */
.statusbar{display:flex;align-items:center;justify-content:space-between}
.statusbar svg{width:31px;height:31px;display:block}

/* ---- 交互态 ---- */
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,opacity .25s ease}
.tap:active{transform:scale(.92)}
.off{opacity:.2}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.blink{animation:blink 1.5s ease-in-out infinite}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}
.hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(31,39,51,.94);color:#fff;
  font-size:13px;letter-spacing:.02em;padding:11px 20px;border-radius:999px;opacity:0;
  transition:opacity .45s ease;pointer-events:none;z-index:99;white-space:nowrap}
.hint.on{opacity:1}
</style>
</head>
<body>
<div class="board">

<!-- ===== Row 1 ===== -->
<div class="cell white circle ctr">
  <div class="face" data-clock>
    <div class="hand hour"></div>
    <div class="hand min"></div>
    <div class="dot-red" id="dotpulse"></div>
  </div>
</div>

<div class="cell">
  <div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;width:100%;height:100%">
    <div class="red circle ctr tap" data-tap="toggle" data-key="silent" title="静音">
      <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68A6.5 6.5 0 0 0 6 11v5l-2 2v1h16v-1l-2-2Z"/><path class="slash" d="M3.4 3.4l17.2 17.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    </div>
    <div class="white circle ctr tap" data-tap="toggle" data-key="wifi" title="Wi-Fi">
      <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.5l3.6-4.5a5.6 5.6 0 0 0-7.2 0l3.6 4.5Zm-6.7-8.4 2.1 2.5a9.2 9.2 0 0 1 9.2 0l2.1-2.5a12.7 12.7 0 0 0-13.4 0ZM1.2 7.4l2.1 2.5a17.7 17.7 0 0 1 17.4 0l2.1-2.5a21.3 21.3 0 0 0-21.6 0Z"/></svg>
    </div>
    <div class="white circle ctr tap" data-tap="toggle" data-key="signal" title="移动信号">
      <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><rect x="2.4" y="16" width="3.4" height="5.4" rx="1.1"/><rect x="7.9" y="12.4" width="3.4" height="9" rx="1.1"/><rect x="13.4" y="8.6" width="3.4" height="12.8" rx="1.1"/><rect x="18.9" y="3.4" width="3.4" height="18" rx="1.1"/></svg>
    </div>
    <div class="navy circle ctr tap" data-tap="toggle" data-key="air" title="飞行模式">
      <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 15.6v-2.2L13 8.6V3.4a1.5 1.5 0 0 0-3 0v5.2L1.5 13.4v2.2L10 13v5.6l-2.2 1.6v1.7L12 21l4.2 1.3v-1.7L14 19v-5.6l7.5 2.2Z"/></svg>
    </div>
  </div>
</div>

<div class="cell white circle ctr">
  <div class="tap" data-tap="dots" title="切换点阵" style="position:relative;width:160px;height:160px">
    <div class="spark" id="dotsA" style="position:absolute;inset:0"></div>
    <div class="spark" id="dotsB" style="position:absolute;inset:0"></div>
  </div>
</div>

<div class="cell navy r44 pad tap" data-tap="weather" title="切换天气" style="display:flex;flex-direction:column">
  <div class="serif t-md" style="font-weight:600" data-live="dow">Friday</div>
  <div class="serif t-lg" style="margin-top:2px" data-live="dmy">21 Feb</div>
  <div class="serif t-md" style="font-weight:600;margin-top:10px" data-live="wtext">Party cloudy</div>
  <div class="row" style="gap:9px;margin-top:6px">
    <svg class="ico-m" viewBox="0 0 24 24" fill="currentColor" style="opacity:.95" data-icon="w"></svg>
    <span class="serif t-lg" data-live="wtemp">26°</span>
  </div>
  <div style="position:absolute;right:22px;bottom:34px"><span class="mclock"><i class="h"></i><i class="m"></i></span></div>
  <div style="position:absolute;right:28px;bottom:22px;width:7px;height:7px;border-radius:50%;background:var(--red)"></div>
</div>

<!-- ===== Row 2 ===== -->
<div class="cell" style="display:flex;flex-direction:column;gap:18px">
  <div class="white rp tap" data-tap="weather" title="切换天气"
       style="flex:1;display:flex;align-items:center;gap:14px;padding:0 24px">
    <svg class="ico" viewBox="0 0 24 24" fill="currentColor" data-icon="w"></svg>
    <div>
      <div class="serif t-lg" data-live="wrange">21-35°</div>
      <div class="t-xs grey ls" style="margin-top:5px" data-live="wlabel">CLOUDY</div>
    </div>
  </div>
  <div class="red rp tap" data-tap="sun" title="日出 / 日落"
       style="flex:1;display:flex;align-items:center;gap:14px;padding:0 24px">
    <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 12.6A5.4 5.4 0 0 1 17.4 12.6Z"/><path d="M12 2.6v2.6M5.2 5.7l1.8 1.8M18.8 5.7l-1.8 1.8M2.3 16.6h19.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    <div>
      <div class="serif t-lg" data-live="suntime">17:32</div>
      <div class="t-xs ls dim" style="margin-top:5px" data-live="sunlabel">SUNRISE</div>
    </div>
  </div>
</div>

<div class="cell white r44 pad tap" data-tap="weather" title="切换天气">
  <div class="t-md" data-live="dowcn">星期五</div>
  <div class="serif t-xl" style="margin-top:4px" data-live="dcn">3月8日</div>
  <div class="t-md" style="margin-top:6px" data-live="wcn">小雨</div>
  <div style="position:absolute;left:24px;bottom:24px;display:flex;align-items:center;gap:10px">
    <svg class="ico" viewBox="0 0 24 24" fill="currentColor" data-icon="w"></svg>
    <span class="serif t-lg" data-live="wtemp">26°</span>
  </div>
  <div style="position:absolute;right:24px;bottom:25px"><span class="mclock"><i class="h"></i><i class="m"></i></span></div>
</div>

<div class="cell" style="display:flex;gap:14px">
  <div class="white r44 tap" data-tap="alarm" title="闹钟开关"
       style="flex:0 0 140px;display:flex;flex-direction:column;align-items:center;justify-content:center">
    <div class="serif t-xl" data-live="hh">22</div>
    <div class="serif t-xl" style="margin-top:2px" data-live="mm">10</div>
    <div id="alarmdot" style="width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:16px"></div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
    <div class="navy circle ctr tap" data-tap="weather" title="切换天气" style="width:96px;height:96px;flex-direction:column">
      <svg class="ico-m" viewBox="0 0 24 24" fill="currentColor" style="margin-bottom:-2px" data-icon="w"></svg>
      <span class="t-xs fwb" data-live="wrange">21-35°</span>
    </div>
    <div class="red circle ctr tap" data-tap="steps" title="加 100 步" style="width:96px;height:96px;flex-direction:column">
      <svg class="ico-m" viewBox="0 0 24 24" fill="currentColor" style="margin-bottom:-2px"><path d="M13.4 5.6a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm-1.9 3.5L8.6 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A6.6 6.6 0 0 0 19.2 13v-2a4.4 4.4 0 0 1-4.4-2.4l-1-1.6a2 2 0 0 0-1.7-1c-.3 0-.5.1-.8.2L6.1 8.4V13h2V9.7l1.8-.7"/></svg>
      <span class="t-sm fwb" data-live="steps">13264</span>
    </div>
  </div>
</div>

<div class="cell white r44 pad tap" data-tap="weather" title="切换天气"
     style="display:flex;flex-direction:column;justify-content:space-between">
  <div>
    <div class="serif t-xl" data-live="hm">22:10</div>
    <div class="t-sm acc fwb" style="margin-top:7px" data-live="dmyen">Mon, 7 Oct</div>
  </div>
  <div class="row" style="gap:12px">
    <svg class="ico" viewBox="0 0 24 24" fill="currentColor" data-icon="w"></svg>
    <div>
      <div class="serif t-lg" data-live="wrange">21-35°</div>
      <div class="t-sm grey" style="margin-top:8px" data-live="wtext">Party cloudy</div>
    </div>
  </div>
</div>

<!-- ===== Row 3 ===== -->
<div class="cell navy r44 pad tap" data-tap="battery" title="切换电量" style="display:flex;flex-direction:column">
  <div class="between" style="align-items:flex-start">
    <div>
      <div class="serif t-xl" data-live="batpct">45%</div>
      <div class="t-xs dim" style="margin-top:8px" data-live="batdays">12 days left</div>
    </div>
    <div class="ring">
      <svg width="54" height="54" viewBox="0 0 54 54">
        <circle cx="27" cy="27" r="22.5" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="5"/>
        <circle id="batarc" cx="27" cy="27" r="22.5" fill="none" stroke="#e04239" stroke-width="5" stroke-linecap="round" stroke-dasharray="63.6 141.4"/>
      </svg>
    </div>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:flex-end">
    <div class="cal-dots" data-cal="4,7,11"></div>
  </div>
  <div class="row" style="gap:8px;align-items:baseline">
    <span class="serif t-lg acc" data-live="dnum">13</span>
    <span class="t-sm dim" data-live="monen">March</span>
  </div>
</div>

<div class="cell white circle ctr tap" data-tap="day" title="点一下换一天">
  <div class="serif t-giant" data-live="dnum">12</div>
</div>

<div class="cell blue r44 pad tap" data-tap="offwork" title="切换下班时间"
     style="display:flex;flex-direction:column;justify-content:space-between">
  <div class="spark" data-spark="4,12.5,4.4" style="margin:12px auto 0"></div>
  <div>
    <div class="t-xs dim">距离下班</div>
    <div class="serif" style="margin-top:6px;font-weight:700;line-height:1">
      <span style="font-size:40px" data-live="offh">16</span><span class="t-md">H</span>&nbsp;<span style="font-size:40px" data-live="offm">32</span><span class="t-md">M</span>
    </div>
  </div>
</div>

<div class="cell white circle ctr">
  <div class="face full-clock" data-ticks data-clock>
    <div class="tickring"></div>
    <div class="hand hour"></div>
    <div class="hand min"></div>
    <div class="hand sec"></div>
    <div class="pin"></div>
  </div>
</div>

<!-- ===== Row 4 ===== -->
<div class="cell white circle ctr">
  <div class="dgrad tap" id="dgrad" data-tap="dgrad" title="切换渐变方向"></div>
</div>

<div class="cell c2" style="display:flex;flex-direction:column;gap:16px">
  <div style="flex:0 0 108px;display:flex;gap:12px">
    <div class="red rp ctr tap" data-tap="day" title="点一下换一天" style="flex:0 0 148px;flex-direction:column;gap:2px">
      <div class="serif t-lg" data-live="dnum">12</div>
      <div class="t-xs dim ls" data-live="dowen">MON</div>
    </div>
    <div class="blue rp ctr tap" data-tap="weather" title="切换天气" style="flex:0 0 100px;flex-direction:column">
      <svg class="ico-m" viewBox="0 0 24 24" fill="currentColor" style="margin-bottom:-2px" data-icon="w"></svg>
      <span class="t-sm fwb" data-live="wrange">12-31°</span>
    </div>
    <div class="navy rp" style="flex:1;display:flex;align-items:center;gap:14px;padding:0 24px">
      <span class="mclock"><i class="h"></i><i class="m"></i></span>
      <div>
        <div class="serif t-md" data-live="hms">17:32:00</div>
        <div class="t-xs dim" style="margin-top:3px" data-live="wtext">Party cloudy</div>
      </div>
    </div>
  </div>
  <div class="white rp statusbar" style="flex:1;padding:0 24px">
    <svg class="tap" data-tap="status" data-key="flower" title="情景模式" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="7" rx="2.6" ry="5"/><ellipse cx="12" cy="7" rx="2.6" ry="5" transform="rotate(60 12 12)"/><ellipse cx="12" cy="7" rx="2.6" ry="5" transform="rotate(120 12 12)"/><ellipse cx="12" cy="7" rx="2.6" ry="5" transform="rotate(180 12 12)"/><ellipse cx="12" cy="7" rx="2.6" ry="5" transform="rotate(240 12 12)"/><ellipse cx="12" cy="7" rx="2.6" ry="5" transform="rotate(300 12 12)"/><circle cx="12" cy="12" r="2.1" fill="#fff"/></svg>
    <svg class="tap" data-tap="status" data-key="wifi" title="Wi-Fi" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.5l3.6-4.5a5.6 5.6 0 0 0-7.2 0l3.6 4.5Zm-6.7-8.4 2.1 2.5a9.2 9.2 0 0 1 9.2 0l2.1-2.5a12.7 12.7 0 0 0-13.4 0ZM1.2 7.4l2.1 2.5a17.7 17.7 0 0 1 17.4 0l2.1-2.5a21.3 21.3 0 0 0-21.6 0Z"/></svg>
    <svg class="tap" data-tap="status" data-key="signal" title="移动信号" viewBox="0 0 24 24" fill="currentColor"><rect x="2.4" y="16" width="3.4" height="5.4" rx="1.1"/><rect x="7.9" y="12.4" width="3.4" height="9" rx="1.1"/><rect x="13.4" y="8.6" width="3.4" height="12.8" rx="1.1"/><rect x="18.9" y="3.4" width="3.4" height="18" rx="1.1"/></svg>
    <svg class="tap" data-tap="status" data-key="air" title="飞行模式" viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 15.6v-2.2L13 8.6V3.4a1.5 1.5 0 0 0-3 0v5.2L1.5 13.4v2.2L10 13v5.6l-2.2 1.6v1.7L12 21l4.2 1.3v-1.7L14 19v-5.6l7.5 2.2Z"/></svg>
    <svg class="tap" data-tap="status" data-key="moon" title="勿扰" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="tap" data-tap="status" data-key="lock" title="锁屏" viewBox="0 0 24 24" fill="currentColor"><path d="M18 9h-1V7A5 5 0 0 0 7 7v2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-6 9a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6Zm3-9H9V7a3 3 0 0 1 6 0v2Z"/></svg>
  </div>
</div>

<div class="cell red r44 pad tap" data-tap="steps" title="加 100 步"
     style="display:flex;flex-direction:column;justify-content:space-between">
  <div>
    <div class="serif t-huge" data-live="steps">3264</div>
    <div class="t-sm dim" style="margin-top:14px" data-live="goal">Goal: 5000</div>
  </div>
  <div class="stepline">
    <span class="dotted"></span>
    <svg class="walker" id="walker" viewBox="0 0 24 24" fill="currentColor"><path d="M13.4 5.6a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm-1.9 3.5L8.6 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3A6.6 6.6 0 0 0 19.2 13v-2a4.4 4.4 0 0 1-4.4-2.4l-1-1.6a2 2 0 0 0-1.7-1c-.3 0-.5.1-.8.2L6.1 8.4V13h2V9.7l1.8-.7"/></svg>
  </div>
</div>

</div>
<div class="hint" id="hint">轻触卡片可交互 · 时钟 / 日期 / 倒计时均为实时</div>

<script>
/* ================= 工具 ================= */
const $$ = s => [...document.querySelectorAll(s)];
const setText = (k, v) => $$(`[data-live="${k}"]`).forEach(e => { v = String(v); if(e.textContent !== v) e.textContent = v; });
const pad2 = n => String(n).padStart(2, '0');

/* ================= 天气图标 ================= */
const ICONS = {
  cloud:  '<path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96Z"/>',
  sun:    '<circle cx="12" cy="12" r="4.4"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1M17.1 17.1l2.1 2.1M19.2 4.8l-2.1 2.1M6.9 17.1l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>',
  rain:   '<path d="M19.35 8.7A7.49 7.49 0 0 0 12 3C9.11 3 6.6 4.5 5.35 6.7A5.9 5.9 0 0 0 0 12.5C0 15.5 2.4 18 5.4 18h13.3c2.6 0 4.7-2.1 4.7-4.7 0-2.5-1.9-4.5-4.4-4.6Z"/><path d="M7.4 20.2l-.8 2.3M12 20.2l-.8 2.3M16.6 20.2l-.8 2.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>',
  overcast:'<path d="M14.6 9.4a5.2 5.2 0 0 0-9.8-1.4A4.1 4.1 0 0 0 5.2 16.9h9.4a3.75 3.75 0 0 0 0-7.5Z"/>'
};
const setIcon = n => $$('[data-icon="w"]').forEach(s => s.innerHTML = ICONS[n]);

/* ================= 数据 ================= */
const WEATHER = [
  { en:'Party cloudy', cn:'多云', icon:'cloud',    lo:21, hi:35, label:'CLOUDY'   },
  { en:'Sunny',        cn:'晴',   icon:'sun',      lo:24, hi:38, label:'SUNNY'    },
  { en:'Light rain',   cn:'小雨', icon:'rain',     lo:18, hi:26, label:'RAINY'    },
  { en:'Overcast',     cn:'阴',   icon:'overcast', lo:16, hi:23, label:'OVERCAST' }
];
const BATS   = [{p:45,d:12},{p:65,d:18},{p:85,d:26},{p:20,d:4}];
const OFFS   = ['17:30','18:00','18:30','19:00'];
const SUNT   = [{t:'17:32',l:'SUNRISE'},{t:'06:41',l:'SUNSET'}];
const DOTSET = [
  { a:[3,11.5,13,'#111318'], b:[8,64,11,'#c8cbd3'] },
  { a:[2,13,10,'#111318'],   b:[12,42,9,'#c8cbd3'] },
  { a:[3,11.5,13,'#e04239'], b:[8,64,11,'#f0b9b5'] }
];
const DGRADS = ['tl','tr','bl','br'];
const DOW_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const MON_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ================= 状态 ================= */
const S = {
  silent:true, wifi:true, signal:true, air:false,
  weather:0, sun:0, alarm:true, bat:0, off:1, dots:0, dgrad:0, dayShift:0,
  steps:3264, goal:5000,
  sb:{ flower:true, wifi:true, signal:true, air:false, moon:true, lock:true }
};

/* ================= 点阵生成器 ================= */
function spark(el, rings, step, size, col, center = true){
  el.innerHTML = '';
  if(center){
    const c = document.createElement('i');
    c.style.cssText = `left:calc(50% - ${size/2}px);top:calc(50% - ${size/2}px);width:${size}px;height:${size}px;background:${col}`;
    el.appendChild(c);
  }
  for(let k=1;k<=rings;k++){
    const n = 6*k, r = step*k, s = size*(1-(k-1)/(rings+2));
    for(let j=0;j<n;j++){
      const a = (j/n)*Math.PI*2 - Math.PI/2;
      const d = document.createElement('i');
      d.style.cssText = `left:calc(50% + ${(Math.cos(a)*r).toFixed(2)}px);top:calc(50% + ${(Math.sin(a)*r).toFixed(2)}px);`
        + `width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;margin:${(-s/2).toFixed(1)}px 0 0 ${(-s/2).toFixed(1)}px;`
        + `background:${col};opacity:${(1-(k-1)/(rings+1)*0.75).toFixed(2)}`;
      el.appendChild(d);
    }
  }
}
function dotRing(el, n, r, size, col, deg = 0){
  el.innerHTML = '';
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 - Math.PI/2 + deg*Math.PI/180;
    const d = document.createElement('i');
    d.style.cssText = `left:calc(50% + ${(Math.cos(a)*r).toFixed(2)}px);top:calc(50% + ${(Math.sin(a)*r).toFixed(2)}px);`
      + `width:${size}px;height:${size}px;margin:${-size/2}px 0 0 ${-size/2}px;background:${col}`;
    el.appendChild(d);
  }
}

/* ---- 一次性绘制 ---- */
$$('[data-ticks]').forEach(el=>{
  const rg = el.querySelector('.tickring'), cx = 125, top = 12.5;
  for(let i=0;i<60;i++){
    const major = i % 5 === 0, len = major ? 15 : 7.5, w = major ? 3.6 : 1.8;
    const d = document.createElement('i');
    d.style.cssText = `left:calc(50% - ${w/2}px);top:${top}px;width:${w}px;height:${len}px;`
      + `transform-origin:50% ${(cx-top).toFixed(1)}px;transform:rotate(${i*6}deg)`;
    rg.appendChild(d);
  }
});
$$('[data-spark]').forEach(el=>{
  const [r,s,z] = el.dataset.spark.split(',').map(Number);
  spark(el, r, s, z, el.dataset.color || '#fff', el.dataset.center !== '0');
});
$$('[data-cal]').forEach(el=>{
  const [rows, cols, on] = el.dataset.cal.split(',').map(Number);
  for(let i=0;i<rows*cols;i++){
    const d = document.createElement('i');
    if(i === on) d.className = 'on';
    el.appendChild(d);
  }
});

/* ================= 渲染 ================= */
function renderDots(){
  const c = DOTSET[S.dots];
  spark(document.getElementById('dotsA'), c.a[0], c.a[1], c.a[2], c.a[3]);
  dotRing(document.getElementById('dotsB'), c.b[0], c.b[1], c.b[2], c.b[3]);
}
function renderDgrad(){
  const el = document.getElementById('dgrad'), dir = DGRADS[S.dgrad];
  el.innerHTML = '';
  const N = 6;
  el.style.gridTemplateColumns = `repeat(${N},1fr)`;
  el.style.gridTemplateRows    = `repeat(${N},1fr)`;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const t = dir==='tl' ? r+c : dir==='tr' ? r+(N-1-c) : dir==='bl' ? (N-1-r)+c : (N-1-r)+(N-1-c);
    const d = document.createElement('i');
    d.style.opacity = (1 - 0.88*(t/((N-1)*2))).toFixed(2);
    el.appendChild(d);
  }
}
function renderWeather(){
  const w = WEATHER[S.weather];
  setText('wtext', w.en); setText('wcn', w.cn);
  setText('wlabel', w.label); setText('wtemp', w.hi + '°');
  setText('wrange', `${w.lo}-${w.hi}°`);
  setIcon(w.icon);
}
function renderSun(){
  setText('suntime', SUNT[S.sun].t);
  setText('sunlabel', SUNT[S.sun].l);
}
function renderBat(){
  const b = BATS[S.bat];
  setText('batpct', b.p + '%');
  setText('batdays', b.d + ' days left');
  document.getElementById('batarc')
    .setAttribute('stroke-dasharray', (141.4*b.p/100).toFixed(1) + ' 141.4');
}
function renderSteps(){
  setText('steps', S.steps);
  setText('goal', 'Goal: ' + S.goal);
  document.getElementById('walker').style.left =
    `calc((100% - 34px) * ${Math.min(1, S.steps/S.goal).toFixed(4)})`;
}
function renderToggles(){
  $$('[data-tap="toggle"]').forEach(el => {          // 开关图标：关闭时变淡；静音斜线只在静音时出现
    const on = S[el.dataset.key], svg = el.querySelector('svg');
    svg.classList.toggle('off', !on);
    const sl = svg.querySelector('.slash');
    if(sl) sl.style.opacity = on ? 1 : 0;
  });
  $$('[data-tap="status"]').forEach(el => el.classList.toggle('off', !S.sb[el.dataset.key]));
}
function renderAlarm(){
  const d = document.getElementById('alarmdot');
  d.style.opacity = S.alarm ? 1 : .16;
  d.classList.toggle('blink', S.alarm);
}

/* ================= 实时刷新 ================= */
function nowDate(){
  const d = new Date();
  d.setDate(d.getDate() + S.dayShift);
  return d;
}
function tick(){
  const n = new Date(), h = n.getHours(), m = n.getMinutes(), s = n.getSeconds();
  $$('[data-clock]').forEach(f=>{
    f.querySelector('.hand.hour').style.transform = `rotate(${(h%12)*30 + m*0.5}deg)`;
    f.querySelector('.hand.min').style.transform  = `rotate(${m*6 + s*0.1}deg)`;
    const sec = f.querySelector('.hand.sec');
    if(sec) sec.style.transform = `rotate(${s*6}deg)`;
  });
  $$('.mclock').forEach(c=>{                 // 小表盘指针同步
    c.querySelector('.h').style.transform = `rotate(${(h%12)*30 + m*0.5}deg)`;
    c.querySelector('.m').style.transform = `rotate(${m*6 + s*0.1}deg)`;
  });
  setText('hms', `${pad2(h)}:${pad2(m)}:${pad2(s)}`);
  setText('hm',  `${pad2(h)}:${pad2(m)}`);
  setText('hh',  pad2(h));
  setText('mm',  pad2(m));
  const d = nowDate();
  setText('dow',   DOW_EN[d.getDay()]);
  setText('dowen', DOW_EN[d.getDay()].toUpperCase());
  setText('dowcn', DOW_CN[d.getDay()]);
  setText('dmy',   `${d.getDate()} ${MON_EN[d.getMonth()]}`);
  setText('dmyen', `${DOW_EN[d.getDay()]}, ${d.getDate()} ${MON_EN[d.getMonth()]}`);
  setText('dcn',   `${d.getMonth()+1}月${d.getDate()}日`);
  setText('dnum',  d.getDate());
  setText('monen', MON_EN[d.getMonth()]);
  countdown();
}
function countdown(){
  const [H, M] = OFFS[S.off].split(':').map(Number);
  const now = new Date();
  const target = new Date(now); target.setHours(H, M, 0, 0);
  let diff = target - now;
  if(diff < 0) diff += 864e5;
  setText('offh', pad2(Math.floor(diff / 36e5)));
  setText('offm', pad2(Math.floor(diff % 36e5 / 6e4)));
}

/* ================= 交互 ================= */
const ACTIONS = {
  toggle(el){ S[el.dataset.key] = !S[el.dataset.key]; renderToggles(); },
  status(el){ S.sb[el.dataset.key] = !S.sb[el.dataset.key]; renderToggles(); },
  weather(){ S.weather = (S.weather + 1) % WEATHER.length; renderWeather(); },
  sun(){ S.sun = (S.sun + 1) % SUNT.length; renderSun(); },
  alarm(){ S.alarm = !S.alarm; renderAlarm(); },
  battery(){ S.bat = (S.bat + 1) % BATS.length; renderBat(); },
  day(){ S.dayShift = (S.dayShift + 1) % 31; tick(); },
  offwork(){ S.off = (S.off + 1) % OFFS.length; countdown(); },
  dots(){ S.dots = (S.dots + 1) % DOTSET.length; renderDots(); },
  dgrad(){ S.dgrad = (S.dgrad + 1) % DGRADS.length; renderDgrad(); },
  steps(){ S.steps += 100; if(S.steps > S.goal) S.steps = 0; renderSteps(); }
};
$$('[data-tap]').forEach(el=>{
  el.addEventListener('click', e=>{
    e.stopPropagation();
    const fn = ACTIONS[el.dataset.tap];
    if(fn) fn(el);
    bump(el);
    flash();
  });
});

/* ================= 提示 ================= */
const hint = document.getElementById('hint');
let hintTimer = setTimeout(() => hint.classList.add('on'), 400);
function flash(){
  clearTimeout(hintTimer);
  hint.classList.remove('on');
  hintTimer = setTimeout(() => hint.classList.add('on'), 140);
  clearTimeout(flash.t);
  flash.t = setTimeout(() => hint.classList.remove('on'), 2600);
}
function bump(el){
  const t = el.classList.contains('tap') ? el : el.closest('.tap');
  if(!t) return;
  t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
}
setTimeout(() => hint.classList.remove('on'), 5000);

/* ================= 启动 ================= */
renderDots(); renderDgrad(); renderWeather(); renderSun();
renderBat(); renderSteps(); renderToggles(); renderAlarm();
tick();
setInterval(tick, 1000);
setInterval(() => {                       // 模拟实时计步
  S.steps = Math.min(S.goal, S.steps + 3);
  renderSteps();
}, 2500);
</script>
</body>
</html>
