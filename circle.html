<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆盘小部件 · 设计稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#2c2c2c; --face:#0c0c0c; --tile:#232323;
  --wl:#f5f5f5; --d1:#9a9a9a; --red:#ec3b2e;
}
body{
  background:var(--bg);color:var(--wl);padding:40px;
  font-family:"Rajdhani","Noto Sans SC",-apple-system,Arial,sans-serif;
  display:flex;justify-content:center;-webkit-font-smoothing:antialiased;user-select:none;
}
.board{display:grid;grid-template-columns:repeat(4,250px);grid-auto-rows:250px;gap:20px}

/* ============ 圆盘基座 ============ */
.w{
  position:relative;width:250px;height:250px;border-radius:50%;background:var(--face);
  display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--wl);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.065), 0 14px 30px rgba(0,0,0,.45);
}
.abs{position:absolute}
.fill{position:absolute;inset:0}
.lab{font-family:"Chakra Petch",sans-serif;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#9d9d9d;font-size:11px}
.cn{font-family:"Noto Sans SC",sans-serif;font-weight:400}
.dm{display:block;line-height:0}
.dm svg{display:block}

/* ============ 刻度圈 / 点圈 / 数字 ============ */
.bezel,.dotring{position:absolute;inset:0}
.bezel i{position:absolute;border-radius:1px;display:block}
.dotring i{position:absolute;border-radius:50%;display:block}
.num{position:absolute;font-family:"Rajdhani",sans-serif;font-weight:600;line-height:1;transform:translate(-50%,-50%)}

/* ============ 指针钟 ============ */
.hands{position:absolute;inset:0}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:99px}
.hand.h{width:7px;height:56px;margin-left:-3.5px;background:linear-gradient(0deg,#6b6b6b,#d2d2d2)}
.hand.m{width:6px;height:78px;margin-left:-3px;background:linear-gradient(0deg,#8d8d8d,#ffffff)}
.hand.s{width:2px;height:90px;margin-left:-1px;background:var(--red)}
.hub{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
  background:#0c0c0c;box-shadow:0 0 0 1.5px rgba(255,255,255,.6);z-index:3}
.hands.glow .hub{background:var(--red);box-shadow:0 0 9px 2.5px rgba(236,59,46,.85)}
.dialline{position:absolute;left:50%;top:50%;width:186px;height:186px;margin:-93px 0 0 -93px;
  border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.055)}

/* ============ 浮动圆角方块 ============ */
.tile{background:var(--tile);border-radius:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 7px 16px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.045)}
.tile.lite{background:#e9e9e9;box-shadow:0 5px 12px rgba(0,0,0,.5)}
.tile.pure{background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.6)}

/* ============ AM / PM ============ */
.ampm{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;
  padding:1px 8px;border-radius:7px;color:rgba(236,59,46,.55)}
.ampm.on{background:var(--red);color:#fff;box-shadow:0 0 12px rgba(236,59,46,.5)}

/* ============ 胶片齿孔 ============ */
.sprockets{display:flex;justify-content:space-between;padding:0 12px}
.sprockets i{display:block;width:13px;height:6px;border-radius:1.5px;background:#fff}

/* ============ 交互态 ============ */
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .16s ease}
.tap:active{transform:scale(.94)}
@keyframes pop{0%{transform:scale(1)}42%{transform:scale(1.045)}100%{transform:scale(1)}}
.pop{animation:pop .34s ease}
.hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(240,240,240,.95);color:#151515;
  font-family:"Noto Sans SC",sans-serif;font-size:13px;letter-spacing:.02em;padding:11px 22px;border-radius:999px;
  opacity:0;transition:opacity .45s ease;pointer-events:none;z-index:99;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hint.on{opacity:1}
</style>
</head>
<body>

<script>
/* ══════════════ 模式：'live' 实时交互 / 'fixed' 静态设计稿 ══════════════ */
const MODE = 'fixed';

const $$ = s => [...document.querySelectorAll(s)];
const pad2 = n => String(n).padStart(2, '0');
const setText = (k, v) => $$(`[data-live="${k}"]`).forEach(e => { v = String(v); if (e.textContent !== v) e.textContent = v; });

/* ══════════════ 5×7 点阵字库 ══════════════ */
const DM = {
  '0':'11111 10001 10001 10001 10001 10001 11111',
  '1':'00100 01100 00100 00100 00100 00100 11111',
  '2':'11111 00001 00001 11111 10000 10000 11111',
  '3':'11111 00001 00001 11111 00001 00001 11111',
  '4':'10001 10001 10001 11111 00001 00001 00001',
  '5':'11111 10000 10000 11111 00001 00001 11111',
  '6':'11111 10000 10000 11111 10001 10001 11111',
  '7':'11111 00001 00001 00010 00100 01000 01000',
  '8':'11111 10001 10001 11111 10001 10001 11111',
  '9':'11111 10001 10001 11111 00001 00001 11111',
  ':':'00000 00100 00000 00000 00000 00100 00000',
  '/':'00001 00010 00010 00100 01000 01000 10000',
  '.':'00000 00000 00000 00000 00000 00000 00100',
  '-':'00000 00000 00000 01110 00000 00000 00000',
  '%':'11000 11001 00010 00100 01000 10011 00011',
  ' ':'00000 00000 00000 00000 00000 00000 00000'
};
const ADV = { ':':2.6, '.':2.6, '/':5.4, ' ':3.4 };      // 单位 = 点距

function dm(text, h, color){
  const gap = .34, u = 1 + gap, defAdv = 6.4;          // 单位数（ADV 同样以「点距」为单位，勿再乘 u）
  let x = 0, rects = '';
  for (const ch of String(text)){
    const bm = DM[ch];
    if (bm) bm.split(' ').forEach((row, r) => {
      for (let c = 0; c < 5; c++) if (row[c] === '1')
        rects += `<rect x="${(x + c * u).toFixed(2)}" y="${(r * u).toFixed(2)}" width="1" height="1" rx="0.3"/>`;
    });
    x += (ADV[ch] || defAdv) * u;
  }
  const W = Math.max(x - 1.4 * u, 1), H = 7 * u, sc = h / H;
  return `<svg width="${(W * sc).toFixed(1)}" height="${h}" viewBox="0 0 ${W.toFixed(2)} ${H.toFixed(2)}" fill="${color}">${rects}</svg>`;
}
function renderDM(key, val){
  const v = String(val);
  $$(`[data-dm="${key}"]`).forEach(el => {
    if (el.dataset.v === v) return;
    el.dataset.v = v;
    el.innerHTML = dm(v, +el.dataset.h, el.dataset.c || '#f5f5f5');
  });
}

/* ══════════════ 几何生成 ══════════════ */
const CX = 125, CY = 125;
function bezel(el, o){
  const { n = 60, r0 = 110, r1 = 124, w = 1.6, c = '#d0d0d0', major = 5, mr0 = 104, mw = 3,
          mc = '#ffffff', a0 = 0, a1 = 360, fade = 0, seg = null } = o;
  const span = a1 - a0, inc = span < 359.9, step = span / (inc ? n - 1 : n);
  for (let i = 0; i < n; i++){
    const mj = major && i % major === 0, ang = a0 + step * i, y0 = mj ? mr0 : r0, ww = mj ? mw : w;
    let op = 1;
    if (fade) op *= Math.min(1, Math.min(i, n - 1 - i) / fade);
    if (seg !== null && i >= seg) op *= .12;
    const d = document.createElement('i');
    d.style.cssText = `left:${CX - ww / 2}px;top:${CY - r1}px;width:${ww}px;height:${r1 - y0}px;`
      + `transform-origin:50% ${r1}px;transform:rotate(${ang}deg);background:${mj ? mc : c};opacity:${op.toFixed(3)}`;
    el.appendChild(d);
  }
}
function dotring(el, o){
  const { n = 60, r = 115, d = 3.2, c = '#8e8e8e', major = 5, md = 4.6, mc = '#ffffff' } = o;
  for (let i = 0; i < n; i++){
    const mj = major && i % major === 0, s = mj ? md : d, a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const e = document.createElement('i');
    e.style.cssText = `left:${CX + Math.cos(a) * r - s / 2}px;top:${CY + Math.sin(a) * r - s / 2}px;`
      + `width:${s}px;height:${s}px;background:${mj ? mc : c};opacity:${mj ? 1 : .72}`;
    el.appendChild(e);
  }
}
function nums(el, o){
  const { r = 88, s = 15, c = '#a9a9a9' } = o;
  for (let i = 1; i <= 12; i++){
    const a = (i * 30 - 90) * Math.PI / 180, e = document.createElement('span');
    e.className = 'num'; e.textContent = i;
    e.style.cssText = `left:${CX + Math.cos(a) * r}px;top:${CY + Math.sin(a) * r}px;font-size:${s}px;color:${c}`;
    el.appendChild(e);
  }
}
function hands(el, o){
  const { h = 56, m = 78 } = o;
  el.innerHTML = `<div class="hand h" style="height:${h}px"></div>`
               + `<div class="hand m" style="height:${m}px"></div>`
               + `<div class="hand s"></div><div class="hub"></div>`;
}
const P = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };
function arcD(r, a0, a1){
  const [x0, y0] = P(r, a0), [x1, y1] = P(r, a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} ${a1 > a0 ? 1 : 0} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

$$('[data-bezel]').forEach(el => bezel(el, JSON.parse(el.dataset.bezel)));
$$('[data-dotring]').forEach(el => dotring(el, JSON.parse(el.dataset.dotring)));
$$('[data-nums]').forEach(el => nums(el, JSON.parse(el.dataset.nums)));
$$('[data-hands]').forEach(el => hands(el, JSON.parse(el.dataset.hands)));
$$('[data-sprockets]').forEach(el => {
  for (let i = 0; i < +el.dataset.sprockets; i++) el.appendChild(document.createElement('i'));
});
(function(){
  const g = document.getElementById('flowerSvg');
  for (let i = 0; i < 6; i++){
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', 108.5); r.setAttribute('y', 31);   // 注意：必须落在 250×250 viewBox 内，否则被裁掉
    r.setAttribute('width', 33); r.setAttribute('height', 68); r.setAttribute('rx', 16.5);
    r.setAttribute('fill', '#3a3a3a'); r.setAttribute('stroke', '#131313'); r.setAttribute('stroke-width', '1');
    r.setAttribute('transform', `rotate(${i * 60} 125 125)`);
    g.appendChild(r);
  }
})();

/* ══════════════ 状态 ══════════════ */
const S = {
  batArr: [100, 85, 65, 45, 20], batIdx: 0,
  ampm: new Date().getHours() < 12 ? 'am' : 'pm',
  flower: true, bdayUsed: true, remainMode: true,
  dayShift: 0, fmt24: true
};
const MON_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const BIRTH = { y: 2020, m: 2, d: 21 };

/* ══════════════ 取时间 ══════════════ */
const isFixed = () => MODE === 'fixed';
function now(){
  if (isFixed()) return new Date(2020, 2, 21, 8, 8, 0);
  const d = new Date(); d.setDate(d.getDate() + S.dayShift); return d;
}
function clock(){
  if (isFixed()) return { h: 8, m: 8, s: 0 };
  const d = new Date(); return { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds() };
}
const dayAt = off => { const t = now(); t.setDate(t.getDate() + off); return t; };

/* ══════════════ 渲染 ══════════════ */
function renderBattery(){
  const p = isFixed() ? 100 : S.batArr[S.batIdx];
  renderDM('batpct', p + '%');
  const el = document.getElementById('bezBat'), lit = Math.round(p / 100 * 30);
  [...el.children].forEach((c, i) => { c.style.opacity = i < lit ? '1' : '.13'; });
}
function renderFlower(){
  const on = isFixed() ? true : S.flower;
  [...document.getElementById('flowerSvg').children]
    .forEach(r => r.setAttribute('fill', on ? '#3a3a3a' : '#1b1b1b'));
  document.getElementById('flowerIco').style.opacity = on ? '1' : '.28';
  document.getElementById('flowerW').style.background = on ? '#0a0a0a' : '#070707';
}
function renderAmpm(){
  const am = isFixed() ? true : S.ampm === 'am';
  document.getElementById('ampmAM').classList.toggle('on', am);
  document.getElementById('ampmPM').classList.toggle('on', !am);
}
function renderTexts(){
  const d = now(), c = clock();
  const H12 = c.h % 12 === 0 ? 12 : c.h % 12, hh = S.fmt24 ? c.h : H12;
  renderDM('hm', pad2(hh) + ':' + pad2(c.m));
  renderDM('hh', pad2(hh));
  renderDM('mm', pad2(c.m));
  renderDM('md',   `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`);
  renderDM('full', `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`);
  renderDM('d0', d.getDate());
  renderDM('d-1', dayAt(-1).getDate());
  renderDM('d+1', dayAt(1).getDate());
  renderDM('year', d.getFullYear());
  setText('dowcn', DOW_CN[d.getDay()]);
  setText('monen', MON_EN[d.getMonth()]);
}
function renderBday(){
  const d = now(), y0 = new Date(d.getFullYear(), 0, 1);
  const doy = Math.floor((d - y0) / 864e5) + 1;
  const y = d.getFullYear();
  const total = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
  const val = isFixed() ? 336 : (S.bdayUsed ? doy : total - doy);
  renderDM('bday', val);
  renderDM('bdate', `${BIRTH.y}/${pad2(BIRTH.m + 1)}/${pad2(BIRTH.d)}`);
  setText('bdaycap', isFixed() ? '出生于' : (S.bdayUsed ? '已过天数' : '距年末'));
  document.querySelector('[data-arc="bday"]').setAttribute('d', arcD(104, 0, 360 * (val / total)));
}
function renderRemain(){
  const d = new Date(); if (isFixed()) d.setHours(8, 8, 0, 0);
  const sec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  const frac = Math.min(1, (86400 - sec) / 86400);
  const use = S.remainMode ? frac : 1 - frac;
  document.querySelector('[data-arc="remain"]').setAttribute('d', arcD(107, 0, -360 * use));
  setText('remcap', S.remainMode ? '今日剩余' : '今日已过');
  renderDM('remainh', Math.floor((S.remainMode ? 86400 - sec : sec) / 3600));
}
let lastMin = -1;
function tick(force){
  const c = clock();
  $$('.hand.h').forEach(e => e.style.transform = `rotate(${(c.h % 12) * 30 + c.m * .5}deg)`);
  $$('.hand.m').forEach(e => e.style.transform = `rotate(${c.m * 6 + c.s * .1}deg)`);
  $$('.hand.s').forEach(e => e.style.transform = `rotate(${c.s * 6}deg)`);
  if (force || c.m !== lastMin){ lastMin = c.m; renderTexts(); renderRemain(); renderBday(); }
}

/* ══════════════ 交互 ══════════════ */
const ACTIONS = {
  battery(){ S.batIdx = (S.batIdx + 1) % S.batArr.length; renderBattery(); },
  ampm(){ S.ampm = S.ampm === 'am' ? 'pm' : 'am'; renderAmpm(); },
  flower(){ S.flower = !S.flower; renderFlower(); },
  bday(){ S.bdayUsed = !S.bdayUsed; renderBday(); },
  remain(){ S.remainMode = !S.remainMode; renderRemain(); },
  day(){ S.dayShift = (S.dayShift + 1) % 14; tick(true); },
  fmt(){ S.fmt24 = !S.fmt24; tick(true); }
};
$$('[data-tap]').forEach(el => el.addEventListener('click', e => {
  e.stopPropagation();
  const fn = ACTIONS[el.dataset.tap];
  if (fn) fn(el);
  bump(el); flash();
}));
const hint = document.getElementById('hint');
hint.classList.add('on');
let hintTimer = setTimeout(() => hint.classList.remove('on'), 5200);
function flash(){
  clearTimeout(hintTimer); hint.classList.remove('on');
  hintTimer = setTimeout(() => hint.classList.add('on'), 150);
  clearTimeout(flash.t); flash.t = setTimeout(() => hint.classList.remove('on'), 2400);
}
function bump(el){
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}

/* ══════════════ 启动 ══════════════ */
renderBattery(); renderFlower(); renderAmpm();
renderTexts(); renderRemain(); renderBday();
tick(true);
if (isFixed()){                                   // 静态设计稿：不可点、无提示
  document.getElementById('hint').remove();
  $$('[data-tap]').forEach(e => e.classList.remove('tap'));
} else {
  setInterval(tick, 1000);
}
</script>
</body>
</html>
